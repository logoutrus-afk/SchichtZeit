<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Schichtzeit</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Schichtzeit">
<meta name="theme-color" content="#0056b3">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230056b3'/%3E%3Ctext x='90' y='120' font-size='90' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3ESZ%3C/text%3E%3C/svg%3E">
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f4f9;color:#333;text-align:center;padding:10px;margin:0;-webkit-tap-highlight-color:transparent}
.container{max-width:600px;margin:0 auto;background:#fff;padding:15px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
h2{margin-top:0;color:#0056b3;font-size:20px}
.online-status{font-size:11px;padding:4px 10px;border-radius:12px;display:inline-block;margin-bottom:10px;font-weight:bold}
.online-status.online{background:#d4edda;color:#155724}
.online-status.offline{background:#f8d7da;color:#721c24}
.online-status.loading{background:#fff3cd;color:#856404}
.top-row{display:flex;justify-content:center;align-items:center;margin-bottom:10px}
.nav-row{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}
select,button{padding:8px 12px;font-size:14px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer}
button{background:#007bff;color:#fff;border:none;font-weight:bold}
button:active{background:#0056b3}
.mode-controls{display:flex;justify-content:center;gap:6px;margin-bottom:15px;background:#e9ecef;padding:8px;border-radius:8px;flex-wrap:wrap}
.mode-btn{background:#fff;color:#333;border:1px solid #ccc;flex:1;min-width:70px;font-size:13px;padding:8px 6px}
.mode-btn.active{background:#0056b3;color:#fff;border-color:#0056b3;font-weight:bold}
.color-picker-row{display:none;justify-content:center;align-items:center;gap:10px;margin-bottom:15px;padding:8px;background:#f1f3f5;border-radius:8px;border:1px dashed #999;flex-wrap:wrap}
.color-picker-row.active{display:flex}
.color-presets{display:flex;gap:6px}
.color-preset{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #999;cursor:pointer;padding:0;position:relative}
.color-preset.active{box-shadow:0 0 0 3px #0056b3}
.color-preset .preset-letter{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:bold;color:#000;pointer-events:none}
.color-preset[data-color="#1E90FF"] .preset-letter,.color-preset[data-color="#FF4500"] .preset-letter{color:#fff}
#monthDisplay{font-size:16px;font-weight:bold;min-width:130px;display:inline-block}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day-header{font-weight:bold;font-size:12px;padding:5px 0;color:#666}
.day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;font-size:14px;font-weight:bold;border:1px solid #eee;position:relative;cursor:pointer;transition:transform 0.1s}
.day:active{transform:scale(0.95)}
.day.F{background-color:#FFD700;color:#000}
.day.S{background-color:#FF4500;color:#fff}
.day.N{background-color:#1E90FF;color:#fff}
.day._{background-color:#f9f9f9;color:#ccc}
.day.krank{background-color:#DDA0DD!important;color:#000!important;border:2px solid #8A2BE2}
.day.urlaub{background-color:#90EE90!important;color:#000!important;border:2px solid #228B22}
.day.sonstige{border:2px solid rgba(0,0,0,0.3);color:#fff;text-shadow:0 0 3px rgba(0,0,0,0.8)}
.day.empty{background:transparent;border:none;cursor:default}
.day.today{border:3px solid #000;box-shadow:0 0 6px rgba(0,0,0,0.4);font-weight:900}
.day.today .date-num{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px;font-weight:900;font-size:13px;color:#000}
.day.feiertag{border:3px solid #CD7F32;animation:pulse-glow 3s infinite ease-in-out;z-index:2}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 0 0 rgba(205,127,50,0.9);border-color:#CD7F32}50%{box-shadow:0 0 15px 8px rgba(205,127,50,0.8);border-color:#FFA500}}
.day.ferien{border:2px dashed #17a2b8;z-index:1}
.ferien-marker{position:absolute;bottom:1px;right:2px;font-size:8px;color:#17a2b8;font-weight:bold;background:#fff;border-radius:2px;padding:0 2px}
.day .date-num{font-size:11.5px;position:absolute;top:2px;left:4px;color:#555;font-weight:normal}
.day.sonstige .date-num{color:#fff;text-shadow:0 0 3px rgba(0,0,0,0.8)}
.legend{margin-top:15px;font-size:11px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-box{width:14px;height:14px;border-radius:3px;border:1px solid #ccc}
.footer{margin-top:20px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.overview-container{display:none;margin-top:20px;text-align:left;background:#f8f9fa;padding:15px;border-radius:8px;border:1px solid #dee2e6}
.overview-container h3{margin-top:0;color:#0056b3;border-bottom:1px solid #ccc;padding-bottom:5px}
.overview-stats{display:flex;justify-content:space-around;margin-bottom:15px;font-weight:bold;flex-wrap:wrap;gap:8px}
.overview-list{margin-bottom:10px}
.overview-list strong{display:block;margin-bottom:5px;color:#333}
.overview-list ul{margin:0;padding-left:20px;font-size:14px;color:#555}
.overview-list li{margin-bottom:3px}
.close-btn{background:#6c757d;font-size:12px;padding:5px 10px;margin-top:10px}
.holiday-note{margin-top:10px;font-size:11px;color:#666;text-align:left;background:#f8f9fa;padding:8px;border-radius:6px;border-left:3px solid #CD7F32;line-height:1.8}
.holiday-note strong.title{color:#CD7F32;display:block;margin-bottom:4px}
.holiday-note .holiday-item{display:inline-block;padding:2px 6px;margin:2px 2px;border-radius:4px;background:#fff;border:1px solid #eee}
.holiday-note .holiday-item.current{background:#FFE8C9;border:2px solid #CD7F32;color:#6b3a06;font-weight:bold;animation:note-pulse 3s infinite ease-in-out}
@keyframes note-pulse{0%,100%{box-shadow:0 0 0 0 rgba(205,127,50,0.7)}50%{box-shadow:0 0 6px 2px rgba(205,127,50,0.3)}}
.ferien-note{display:none;margin-top:10px;font-size:11px;color:#666;text-align:left;background:#e7f6f8;padding:8px;border-radius:6px;border-left:3px solid #17a2b8;line-height:1.6}
</style>
</head>
<body>
<div class="container">
<h2>Schichtzeit</h2>
<div id="onlineStatus" class="online-status loading">⏳ Datum wird geladen...</div>

<div class="top-row">
<label>Schicht: 
<select id="groupSelect">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
</select>
</label>
</div>

<div class="nav-row">
<button id="prevBtn">← Zurück</button>
<span id="monthDisplay"></span>
<button id="nextBtn">Weiter →</button>
</div>

<div class="mode-controls">
<button class="mode-btn active" data-mode="normal">Normal</button>
<button class="mode-btn" data-mode="krank">Krank</button>
<button class="mode-btn" data-mode="urlaub">Urlaub</button>
<button class="mode-btn" data-mode="sonstige">Sonstige</button>
</div>

<div class="color-picker-row" id="colorPickerRow">
<label for="sonstigeColor">Farbe:</label>
<input type="color" id="sonstigeColor" value="#FFD700">
<div class="color-presets">
<button class="color-preset" data-color="#FFD700" style="background:#FFD700;" title="Früh"><span class="preset-letter">F</span></button>
<button class="color-preset" data-color="#FF4500" style="background:#FF4500;" title="Spät"><span class="preset-letter">S</span></button>
<button class="color-preset" data-color="#1E90FF" style="background:#1E90FF;" title="Nacht"><span class="preset-letter">N</span></button>
<button class="color-preset" data-color="#FFFFFF" style="background:#FFFFFF;" title="Frei"><span class="preset-letter" style="color:#999;">–</span></button>
</div>
</div>

<div class="calendar" id="calendar"></div>

<div class="legend">
<div class="legend-item"><div class="legend-box" style="background:#FFD700;"></div> F (Früh)</div>
<div class="legend-item"><div class="legend-box" style="background:#FF4500;"></div> S (Spät)</div>
<div class="legend-item"><div class="legend-box" style="background:#1E90FF;"></div> N (Nacht)</div>
<div class="legend-item"><div class="legend-box" style="background:#f9f9f9;"></div> Frei</div>
<div class="legend-item"><div class="legend-box" style="background:#DDA0DD;"></div> Krank</div>
<div class="legend-item"><div class="legend-box" style="background:#90EE90;"></div> Urlaub</div>
<div class="legend-item"><div class="legend-box" id="legendSonstige" style="background:#FFD700;"></div> Sonstige</div>
<div class="legend-item"><div class="legend-box" style="background:#fff;border:3px solid #CD7F32;"></div> Feiertag</div>
<div class="legend-item"><div class="legend-box" style="background:#fff;border:2px dashed #17a2b8;"></div> Ferien</div>
</div>

<div class="footer">
<button onclick="resetData()" style="background:#dc3545;">Alle Markierungen löschen</button>
<button onclick="toggleYearOverview()" style="background:#28a745;">Jahresübersicht</button>
<button onclick="toggleFerien()" id="ferienBtn" style="background:#17a2b8;">Ferien</button>
<button onclick="createBackup()" style="background:#6f42c1;">💾 Backup</button>
<button onclick="restoreBackup()" style="background:#fd7e14;">📂 Restore</button>
<input type="file" id="restoreFileInput" accept=".json" style="display:none;">
</div>

<div class="holiday-note">
<strong class="title">Feiertage in diesem Monat:</strong>
<div id="holidayList"></div>
</div>

<div class="ferien-note" id="ferienNote">
<strong>Ferien in Bayern:</strong><br>
<span id="ferienList"></span>
</div>

<div id="yearOverview" class="overview-container">
<h3>Jahresübersicht <span id="overviewYear"></span></h3>
<div class="overview-stats">
<span style="color:#8A2BE2;">Krank: <span id="countKrank">0</span> Tage</span>
<span style="color:#228B22;">Urlaub: <span id="countUrlaub">0</span> Tage</span>
<span style="color:#666;">Sonstige: <span id="countSonstige">0</span> Tage</span>
</div>
<div class="overview-list"><strong>Krankheitstage:</strong><ul id="listKrank"></ul></div>
<div class="overview-list"><strong>Urlaubstage:</strong><ul id="listUrlaub"></ul></div>
<div class="overview-list"><strong>Sonstige Tage:</strong><ul id="listSonstige"></ul></div>
<button class="close-btn" onclick="toggleYearOverview()">Schließen</button>
</div>
</div>

<script>
// ============================================================
// BASIS: 1. OKTOBER 2026
// ============================================================
const BASE_DATE = new Date(2026, 9, 1);

// 35-Tage-Zyklus. Nach 7 Freitagen wiederholt sich alles.
const CYCLE_35 = [
'F','F','N','N','N','_','_','_',
'S','S','S','_',
'F','F','N','N','_','_','_',
'S','S','S','_',
'F','F','F','N','N',
'_','_','_','_','_','_','_'
];

// Start-Indizes für 1. Oktober 2026
const START_INDEX_BY_GROUP = {
'1': 29,   // Block startet 7. Okt
'2': 1,    // Block startet 4. Nov
'3': 8,    // Block startet 28. Okt
'4': 15,   // Block startet 21. Okt
'5': 22    // Block startet 14. Okt
};

let currentDate = new Date(2026, 9, 1);
let currentMode = 'normal';
let showFerien = false;
let actualToday = new Date();
actualToday.setHours(0,0,0,0);
let selectedColor = localStorage.getItem('schichtzeitColor') || '#FFD700';

let sickDays = JSON.parse(localStorage.getItem('schichtzeitSickDays') || '[]');
let vacationDays = JSON.parse(localStorage.getItem('schichtzeitVacationDays') || '[]');
let sonstigeDays = JSON.parse(localStorage.getItem('schichtzeitSonstigeDays') || '{}');

const savedGroup = localStorage.getItem('schichtzeitGroup') || '1';
document.getElementById('groupSelect').value = savedGroup;
document.getElementById('sonstigeColor').value = selectedColor;

const monthNames = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const dayNames = ["Mo","Di","Mi","Do","Fr","Sa","So"];

// ============================================================
// ONLINE-ZEIT
// ============================================================
function updateOnlineStatus(text, status) {
    const el = document.getElementById('onlineStatus');
    el.textContent = text;
    el.className = 'online-status ' + status;
}

async function syncOnlineDate() {
    updateOnlineStatus('⏳ Datum wird geladen...', 'loading');
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 6000);
        const response = await fetch('https://timeapi.io/api/Time/current/zone?timeZone=Europe/Berlin', {signal: controller.signal, cache: 'no-store'});
        clearTimeout(timeoutId);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        const y = data.year, m = data.month - 1, d = data.day;
        const hh = String(data.hour).padStart(2,'0');
        const mm = String(data.minute).padStart(2,'0');
        actualToday = new Date(y, m, d);
        const wd = dayNames[actualToday.getDay() === 0 ? 6 : actualToday.getDay() - 1];
        updateOnlineStatus('🌐 Online · ' + hh + ':' + mm + ' Uhr · ' + wd + ' ' + String(d).padStart(2,'0') + '.' + String(m+1).padStart(2,'0') + '.' + y, 'online');
        renderCalendar();
    } catch (err) {
        const deviceDate = new Date();
        actualToday = new Date(deviceDate.getFullYear(), deviceDate.getMonth(), deviceDate.getDate());
        const timeStr = String(deviceDate.getHours()).padStart(2,'0') + ':' + String(deviceDate.getMinutes()).padStart(2,'0');
        updateOnlineStatus('📴 Offline · Gerätezeit ' + timeStr + ' Uhr', 'offline');
        renderCalendar();
    }
}

setInterval(syncOnlineDate, 5 * 60 * 1000);

// ============================================================
// OSTERN & FEIERTAGE
// ============================================================
function calculateEaster(year) {
    const a = year % 19, b = Math.floor(year / 100), c = year % 100;
    const d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31);
    const day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(year, month - 1, day);
}

function getHolidayList(year) {
    const list = [];
    const add = (m, d, name) => {
        const date = new Date(year, m - 1, d);
        list.push({name, date, key: `${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`});
    };
    add(1,1,"Neujahr");
    add(1,6,"Heilige Drei Könige");
    add(5,1,"Tag der Arbeit");
    add(8,15,"Mariä Himmelfahrt");
    add(10,3,"Tag der Deutschen Einheit");
    add(11,1,"Allerheiligen");
    add(12,25,"1. Weihnachtstag");
    add(12,26,"2. Weihnachtstag");
    const easter = calculateEaster(year);
    const addEaster = (days, name) => {
        const d = new Date(easter);
        d.setDate(d.getDate() + days);
        add(d.getMonth()+1, d.getDate(), name);
    };
    addEaster(-2,"Karfreitag");
    addEaster(1,"Ostermontag");
    addEaster(39,"Christi Himmelfahrt");
    addEaster(50,"Pfingstmontag");
    addEaster(60,"Fronleichnam");
    list.sort((a,b) => a.date - b.date);
    return list;
}

function getHolidaySet(year) {
    const s = new Set();
    getHolidayList(year).forEach(h => s.add(h.key));
    return s;
}

// ============================================================
// FERIEN
// ============================================================
const FERIEN = {
2026: [
{name:"Winterferien",start:"2026-02-16",end:"2026-02-20"},
{name:"Osterferien",start:"2026-03-30",end:"2026-04-10"},
{name:"Pfingstferien",start:"2026-05-26",end:"2026-06-05"},
{name:"Sommerferien",start:"2026-08-01",end:"2026-09-14"},
{name:"Herbstferien",start:"2026-11-02",end:"2026-11-06"},
{name:"Weihnachtsferien",start:"2026-12-21",end:"2026-12-31"}
],
2027: [
{name:"Winterferien",start:"2027-02-15",end:"2027-02-19"},
{name:"Osterferien",start:"2027-03-22",end:"2027-04-02"},
{name:"Pfingstferien",start:"2027-05-18",end:"2027-05-28"},
{name:"Sommerferien",start:"2027-08-02",end:"2027-09-13"},
{name:"Herbstferien",start:"2027-11-02",end:"2027-11-05"},
{name:"Weihnachtsferien",start:"2027-12-23",end:"2027-12-31"}
],
2028: [
{name:"Winterferien",start:"2028-02-14",end:"2028-02-18"},
{name:"Osterferien",start:"2028-04-10",end:"2028-04-21"},
{name:"Pfingstferien",start:"2028-06-06",end:"2028-06-16"},
{name:"Sommerferien",start:"2028-07-31",end:"2028-09-11"},
{name:"Herbstferien",start:"2028-10-30",end:"2028-11-03"},
{name:"Weihnachtsferien",start:"2028-12-23",end:"2028-12-31"}
]
};

function getFerienSet(year) {
    const set = new Set();
    (FERIEN[year] || []).forEach(period => {
        let current = new Date(period.start);
        const end = new Date(period.end);
        while (current <= end) {
            set.add(`${current.getFullYear()}-${String(current.getMonth()+1).padStart(2,'0')}-${String(current.getDate()).padStart(2,'0')}`);
            current.setDate(current.getDate() + 1);
        }
    });
    return set;
}

// ============================================================
// SCHICHT-BERECHNUNG
// ============================================================
function formatDateKey(date) {
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

function getShift(date, group) {
    const g = String(group);
    const startIndex = START_INDEX_BY_GROUP[g];
    if (startIndex === undefined) return '_';
    const diffTime = date.getTime() - BASE_DATE.getTime();
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
    let index = (startIndex + diffDays) % CYCLE_35.length;
    if (index < 0) index += CYCLE_35.length;
    return CYCLE_35[index];
}

// ============================================================
// RENDERING
// ============================================================
function renderHolidayNote(year, month) {
    const listEl = document.getElementById('holidayList');
    const allList = getHolidayList(year);
    const currentList = allList.filter(h => h.date.getMonth() === month);
    if (currentList.length === 0) {
        listEl.innerHTML = '<span style="color:#999;font-style:italic;">Keine Feiertage in diesem Monat.</span>';
        return;
    }
    listEl.innerHTML = currentList.map(h => {
        const dd = String(h.date.getDate()).padStart(2,'0');
        const mm = String(h.date.getMonth()+1).padStart(2,'0');
        return `<span class="holiday-item current">${h.name} (${dd}.${mm})</span>`;
    }).join('');
}

function updateColorPresetsActive() {
    document.querySelectorAll('.color-preset').forEach(btn => {
        const c = btn.getAttribute('data-color').toLowerCase();
        if (c === selectedColor.toLowerCase()) btn.classList.add('active');
        else btn.classList.remove('active');
    });
}

function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const group = document.getElementById('groupSelect').value;
    const holidays = getHolidaySet(year);
    const ferienSet = showFerien ? getFerienSet(year) : new Set();

    document.getElementById('monthDisplay').textContent = monthNames[month] + ' ' + year;

    const firstDayOfMonth = new Date(year, month, 1);
    const lastDayOfMonth = new Date(year, month + 1, 0);

    let startDay = firstDayOfMonth.getDay();
    startDay = startDay === 0 ? 6 : startDay - 1;

    const calendarEl = document.getElementById('calendar');
    calendarEl.innerHTML = '';

    dayNames.forEach(day => {
        const h = document.createElement('div');
        h.className = 'day-header';
        h.textContent = day;
        calendarEl.appendChild(h);
    });

    for (let i = 0; i < startDay; i++) {
        const e = document.createElement('div');
        e.className = 'day empty';
        calendarEl.appendChild(e);
    }

    for (let day = 1; day <= lastDayOfMonth.getDate(); day++) {
        const date = new Date(year, month, day);
        const dateKey = formatDateKey(date);
        const shift = getShift(date, group);

        const dayEl = document.createElement('div');
        dayEl.className = 'day ' + shift;

        if (sickDays.includes(dateKey)) dayEl.classList.add('krank');
        else if (vacationDays.includes(dateKey)) dayEl.classList.add('urlaub');

        if (date.getTime() === actualToday.getTime()) dayEl.classList.add('today');

        if (holidays.has(dateKey)) dayEl.classList.add('feiertag');

        if (showFerien && ferienSet.has(dateKey)) {
            dayEl.classList.add('ferien');
            const fm = document.createElement('span');
            fm.className = 'ferien-marker';
            fm.textContent = 'F';
            dayEl.appendChild(fm);
        }

        const dn = document.createElement('span');
        dn.className = 'date-num';
        dn.textContent = day;
        dayEl.appendChild(dn);

        const st = document.createElement('span');
        st.textContent = shift === '_' ? '' : shift;
        dayEl.appendChild(st);

        if (sonstigeDays[dateKey] && !sickDays.includes(dateKey) && !vacationDays.includes(dateKey)) {
            dayEl.classList.add('sonstige');
            dayEl.style.backgroundColor = sonstigeDays[dateKey];
            const isDark = isColorDark(sonstigeDays[dateKey]);
            dayEl.style.color = isDark ? '#fff' : '#000';
            dn.style.color = dayEl.style.color;
            if (sonstigeDays[dateKey].toUpperCase() === '#FFFFFF') {
                dayEl.style.border = '2px solid #999';
            }
        }

        dayEl.addEventListener('click', () => {
            if (currentMode === 'krank') toggleDay(dateKey, 'krank');
            else if (currentMode === 'urlaub') toggleDay(dateKey, 'urlaub');
            else if (currentMode === 'sonstige') toggleSonstige(dateKey);
            else {
                toggleDay(dateKey, 'krank', true);
                toggleDay(dateKey, 'urlaub', true);
                toggleSonstige(dateKey, true);
            }
        });

        calendarEl.appendChild(dayEl);
    }

    renderHolidayNote(year, month);
    updateYearOverview();
    updateFerienList(year);
}

function isColorDark(hex) {
    const c = hex.replace('#','');
    const r = parseInt(c.substr(0,2), 16);
    const g = parseInt(c.substr(2,2), 16);
    const b = parseInt(c.substr(4,2), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255 < 0.6;
}

function updateFerienList(year) {
    const listEl = document.getElementById('ferienList');
    const periods = FERIEN[year] || [];
    if (periods.length === 0) {
        listEl.innerHTML = 'Keine Daten für dieses Jahr verfügbar.';
        return;
    }
    const formatD = (s) => {
        const [y,m,d] = s.split('-');
        return `${d}.${m}.${y}`;
    };
    listEl.innerHTML = periods.map(p => `${p.name}: ${formatD(p.start)} – ${formatD(p.end)}`).join('<br>');
}

function toggleDay(dateKey, type, forceRemove) {
    forceRemove = forceRemove || false;
    let array = type === 'krank' ? sickDays : vacationDays;
    const index = array.indexOf(dateKey);

    if (index > -1 || forceRemove) {
        if (index > -1) array.splice(index, 1);
    } else {
        array.push(dateKey);
        if (type === 'krank') {
            const vIndex = vacationDays.indexOf(dateKey);
            if (vIndex > -1) vacationDays.splice(vIndex, 1);
        } else if (type === 'urlaub') {
            const sIndex = sickDays.indexOf(dateKey);
            if (sIndex > -1) sickDays.splice(sIndex, 1);
        }
        if (sonstigeDays[dateKey]) {
            delete sonstigeDays[dateKey];
            localStorage.setItem('schichtzeitSonstigeDays', JSON.stringify(sonstigeDays));
        }
    }

    if (type === 'krank' || forceRemove) localStorage.setItem('schichtzeitSickDays', JSON.stringify(sickDays));
    if (type === 'urlaub' || forceRemove) localStorage.setItem('schichtzeitVacationDays', JSON.stringify(vacationDays));
    renderCalendar();
}

function toggleSonstige(dateKey, forceRemove) {
    forceRemove = forceRemove || false;
    if (sonstigeDays[dateKey] && !forceRemove) {
        delete sonstigeDays[dateKey];
    } else if (!forceRemove) {
        sonstigeDays[dateKey] = selectedColor;
        const sIndex = sickDays.indexOf(dateKey);
        if (sIndex > -1) sickDays.splice(sIndex, 1);
        const vIndex = vacationDays.indexOf(dateKey);
        if (vIndex > -1) vacationDays.splice(vIndex, 1);
        localStorage.setItem('schichtzeitSickDays', JSON.stringify(sickDays));
        localStorage.setItem('schichtzeitVacationDays', JSON.stringify(vacationDays));
    } else {
        delete sonstigeDays[dateKey];
    }
    localStorage.setItem('schichtzeitSonstigeDays', JSON.stringify(sonstigeDays));
    renderCalendar();
}

function toggleFerien() {
    showFerien = !showFerien;
    document.getElementById('ferienBtn').style.background = showFerien ? '#0d8a99' : '#17a2b8';
    document.getElementById('ferienNote').style.display = showFerien ? 'block' : 'none';
    renderCalendar();
}

function updateYearOverview() {
    const year = currentDate.getFullYear();
    document.getElementById('overviewYear').textContent = year;

    const yearSick = sickDays.filter(d => d.startsWith(year + '-')).sort();
    const yearVacation = vacationDays.filter(d => d.startsWith(year + '-')).sort();
    const yearSonstige = Object.keys(sonstigeDays).filter(d => d.startsWith(year + '-')).sort();

    document.getElementById('countKrank').textContent = yearSick.length;
    document.getElementById('countUrlaub').textContent = yearVacation.length;
    document.getElementById('countSonstige').textContent = yearSonstige.length;

    const formatDate = (dateStr) => {
        const [y,m,d] = dateStr.split('-');
        return `${d}.${m}.${y}`;
    };

    document.getElementById('listKrank').innerHTML = yearSick.length ? yearSick.map(d => `<li>${formatDate(d)}</li>`).join('') : '<li>Keine Einträge</li>';
    document.getElementById('listUrlaub').innerHTML = yearVacation.length ? yearVacation.map(d => `<li>${formatDate(d)}</li>`).join('') : '<li>Keine Einträge</li>';
    document.getElementById('listSonstige').innerHTML = yearSonstige.length ? yearSonstige.map(d => {
        const color = sonstigeDays[d];
        return `<li><span style="display:inline-block;width:12px;height:12px;background:${color};border:1px solid #999;border-radius:3px;vertical-align:middle;margin-right:6px;"></span>${formatDate(d)}</li>`;
    }).join('') : '<li>Keine Einträge</li>';
}

function toggleYearOverview() {
    const overview = document.getElementById('yearOverview');
    if (overview.style.display === 'block') {
        overview.style.display = 'none';
    } else {
        overview.style.display = 'block';
        updateYearOverview();
    }
}

function resetData() {
    if (confirm("Möchtest du wirklich alle Markierungen löschen?")) {
        sickDays = [];
        vacationDays = [];
        sonstigeDays = {};
        localStorage.removeItem('schichtzeitSickDays');
        localStorage.removeItem('schichtzeitVacationDays');
        localStorage.removeItem('schichtzeitSonstigeDays');
        renderCalendar();
    }
}

// ============================================================
// BACKUP / RESTORE
// ============================================================
function createBackup() {
    const backup = {
        version: 1,
        date: new Date().toISOString(),
        group: document.getElementById('groupSelect').value,
        color: selectedColor,
        sickDays: sickDays,
        vacationDays: vacationDays,
        sonstigeDays: sonstigeDays
    };
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const now = new Date();
    const filename = 'Schichtzeit_Backup_' +
        now.getFullYear() + '-' +
        String(now.getMonth()+1).padStart(2,'0') + '-' +
        String(now.getDate()).padStart(2,'0') + '_' +
        String(now.getHours()).padStart(2,'0') + '-' +
        String(now.getMinutes()).padStart(2,'0') + '.json';
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

function restoreBackup() {
    const input = document.getElementById('restoreFileInput');
    input.value = '';
    input.click();
}

document.getElementById('restoreFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
        try {
            const data = JSON.parse(event.target.result);
            if (!data.sickDays && !data.vacationDays && !data.sonstigeDays) {
                alert('Ungültige Backup-Datei.');
                return;
            }
            if (!confirm('Backup wiederherstellen? Die aktuellen Daten werden überschrieben.')) return;

            sickDays = data.sickDays || [];
            vacationDays = data.vacationDays || [];
            sonstigeDays = data.sonstigeDays || {};
            if (data.group) {
                document.getElementById('groupSelect').value = data.group;
                localStorage.setItem('schichtzeitGroup', data.group);
            }
            if (data.color) {
                selectedColor = data.color;
                document.getElementById('sonstigeColor').value = selectedColor;
                document.getElementById('legendSonstige').style.background = selectedColor;
                localStorage.setItem('schichtzeitColor', selectedColor);
                updateColorPresetsActive();
            }

            localStorage.setItem('schichtzeitSickDays', JSON.stringify(sickDays));
            localStorage.setItem('schichtzeitVacationDays', JSON.stringify(vacationDays));
            localStorage.setItem('schichtzeitSonstigeDays', JSON.stringify(sonstigeDays));

            renderCalendar();
            alert('✅ Backup erfolgreich wiederhergestellt!');
        } catch (err) {
            alert('Fehler beim Lesen der Backup-Datei: ' + err.message);
        }
    };
    reader.readAsText(file);
});

// ============================================================
// СОБЫТИЯ
// ============================================================
document.getElementById('prevBtn').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
});

document.getElementById('nextBtn').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
});

document.getElementById('groupSelect').addEventListener('change', (e) => {
    localStorage.setItem('schichtzeitGroup', e.target.value);
    renderCalendar();
});

document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentMode = e.target.getAttribute('data-mode');
        const picker = document.getElementById('colorPickerRow');
        if (currentMode === 'sonstige') picker.classList.add('active');
        else picker.classList.remove('active');
    });
});

document.getElementById('sonstigeColor').addEventListener('input', (e) => {
    selectedColor = e.target.value;
    localStorage.setItem('schichtzeitColor', selectedColor);
    document.getElementById('legendSonstige').style.background = selectedColor;
    updateColorPresetsActive();
});

document.querySelectorAll('.color-preset').forEach(btn => {
    btn.addEventListener('click', () => {
        selectedColor = btn.getAttribute('data-color');
        document.getElementById('sonstigeColor').value = selectedColor;
        document.getElementById('legendSonstige').style.background = selectedColor;
        localStorage.setItem('schichtzeitColor', selectedColor);
        updateColorPresetsActive();
    });
});

document.getElementById('legendSonstige').style.background = selectedColor;
updateColorPresetsActive();

renderCalendar();
syncOnlineDate();
</script>
