<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Schichtzeit</title>

    <!-- PWA-Tags für iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Schichtzeit">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0056b3">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230056b3'/%3E%3Ctext x='90' y='120' font-size='90' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3ESZ%3C/text%3E%3C/svg%3E">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 10px;
            padding-top: env(safe-area-inset-top, 10px);
            padding-bottom: env(safe-area-inset-bottom, 10px);
            margin: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { margin-top: 0; color: #0056b3; font-size: 20px; }
        
        .top-row {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .nav-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        select, button {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
        }
        button {
            background: #007bff;
            color: #fff;
            border: none;
            font-weight: bold;
        }
        button:active { background: #0056b3; }
        
        .mode-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            background: #e9ecef;
            padding: 10px;
            border-radius: 8px;
        }
        .mode-btn {
            background: #fff;
            color: #333;
            border: 1px solid #ccc;
            font-weight: normal;
            flex: 1;
        }
        .mode-btn.active {
            background: #0056b3;
            color: #fff;
            border-color: #0056b3;
            font-weight: bold;
        }

        #monthDisplay {
            font-size: 16px;
            font-weight: bold;
            min-width: 130px;
            display: inline-block;
        }
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .day-header {
            font-weight: bold;
            font-size: 12px;
            padding: 5px 0;
            color: #666;
        }
        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #eee;
            position: relative;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }
        .day:active { transform: scale(0.95); }
        
        .day.F { background-color: #FFD700; color: #000; }
        .day.S { background-color: #FF4500; color: #fff; }
        .day.N { background-color: #1E90FF; color: #fff; }
        .day._ { background-color: #f9f9f9; color: #ccc; }
        
        .day.krank { background-color: #DDA0DD !important; color: #000 !important; border: 2px solid #8A2BE2; }
        .day.urlaub { background-color: #90EE90 !important; color: #000 !important; border: 2px solid #228B22; }
        
        .day.empty { background: transparent; border: none; cursor: default; }
        .day.today { border: 3px solid #000; box-shadow: 0 0 5px rgba(0,0,0,0.3); }
        
        .day.feiertag {
            border: 3px solid #CD7F32;
            animation: pulse-glow 3s infinite ease-in-out;
            z-index: 2;
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(205, 127, 50, 0.9); border-color: #CD7F32; }
            50% { box-shadow: 0 0 15px 8px rgba(205, 127, 50, 0.8); border-color: #FFA500; }
            100% { box-shadow: 0 0 0 0 rgba(205, 127, 50, 0.9); border-color: #CD7F32; }
        }

        .day.ferien { border: 2px dashed #17a2b8; z-index: 1; }
        
        .ferien-marker {
            position: absolute;
            bottom: 1px;
            right: 2px;
            font-size: 8px;
            color: #17a2b8;
            font-weight: bold;
            background: #fff;
            border-radius: 2px;
            padding: 0 2px;
        }

        .day .date-num {
            font-size: 11.5px;
            position: absolute;
            top: 2px;
            left: 4px;
            color: #555;
            font-weight: normal;
        }

        .legend {
            margin-top: 15px;
            font-size: 11px;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .legend-box { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #ccc; }
        
        .footer {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .overview-container {
            display: none;
            margin-top: 20px;
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
        .overview-container h3 {
            margin-top: 0;
            color: #0056b3;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }
        .overview-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .overview-list { margin-bottom: 10px; }
        .overview-list strong { display: block; margin-bottom: 5px; color: #333; }
        .overview-list ul { margin: 0; padding-left: 20px; font-size: 14px; color: #555; }
        .overview-list li { margin-bottom: 3px; }
        .close-btn { background: #6c757d; font-size: 12px; padding: 5px 10px; margin-top: 10px; }

        .holiday-note {
            margin-top: 10px;
            font-size: 11px;
            color: #666;
            text-align: left;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 6px;
            border-left: 3px solid #CD7F32;
            line-height: 1.8;
        }
        .holiday-note strong.title {
            color: #CD7F32;
            display: block;
            margin-bottom: 4px;
        }
        .holiday-note .holiday-item {
            display: inline-block;
            padding: 2px 6px;
            margin: 2px 2px;
            border-radius: 4px;
            background: #fff;
            border: 1px solid #eee;
        }
        .holiday-note .holiday-item.current {
            background: #FFE8C9;
            border: 2px solid #CD7F32;
            color: #6b3a06;
            font-weight: bold;
            animation: note-pulse 3s infinite ease-in-out;
        }
        @keyframes note-pulse {
            0% { box-shadow: 0 0 0 0 rgba(205, 127, 50, 0.7); }
            50% { box-shadow: 0 0 6px 2px rgba(205, 127, 50, 0.3); }
            100% { box-shadow: 0 0 0 0 rgba(205, 127, 50, 0.7); }
        }

        .ferien-note {
            display: none;
            margin-top: 10px;
            font-size: 11px;
            color: #666;
            text-align: left;
            background: #e7f6f8;
            padding: 8px;
            border-radius: 6px;
            border-left: 3px solid #17a2b8;
            line-height: 1.6;
        }
        .ferien-note strong { color: #17a2b8; }

        /* Подсказка для iOS */
        .ios-hint {
            display: none;
            background: #0056b3;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: left;
            line-height: 1.5;
        }
        .ios-hint strong { color: #FFD700; }
        .ios-hint .close-hint {
            float: right;
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Подсказка для iOS, показывается только в Safari, если не добавлено на главный экран -->
        <div class="ios-hint" id="iosHint">
            <button class="close-hint" onclick="closeIosHint()">×</button>
            <strong>So wird's zur App:</strong><br>
            Нажмите <strong>«Поделиться»</strong> внизу Safari → <strong>«На экран "Домой"</strong>» → <strong>«Добавить»</strong>.
        </div>

        <h2>Schichtzeit</h2>
        
        <div class="top-row">
            <label>Schicht: 
                <select id="groupSelect">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </label>
        </div>

        <div class="nav-row">
            <button id="prevBtn">← Zurück</button>
            <span id="monthDisplay"></span>
            <button id="nextBtn">Weiter →</button>
        </div>

        <div class="mode-controls">
            <button class="mode-btn active" data-mode="normal">Normal</button>
            <button class="mode-btn" data-mode="krank">Krank</button>
            <button class="mode-btn" data-mode="urlaub">Urlaub</button>
        </div>

        <div class="calendar" id="calendar"></div>

        <div class="legend">
            <div class="legend-item"><div class="legend-box" style="background:#FFD700;"></div> F (Früh)</div>
            <div class="legend-item"><div class="legend-box" style="background:#FF4500;"></div> S (Spät)</div>
            <div class="legend-item"><div class="legend-box" style="background:#1E90FF;"></div> N (Nacht)</div>
            <div class="legend-item"><div class="legend-box" style="background:#f9f9f9;"></div> Frei</div>
            <div class="legend-item"><div class="legend-box" style="background:#DDA0DD;"></div> Krank</div>
            <div class="legend-item"><div class="legend-box" style="background:#90EE90;"></div> Urlaub</div>
            <div class="legend-item"><div class="legend-box" style="background:#fff; border: 3px solid #CD7F32;"></div> Feiertag</div>
            <div class="legend-item"><div class="legend-box" style="background:#fff; border: 2px dashed #17a2b8;"></div> Ferien</div>
        </div>
        
        <div class="footer">
            <button onclick="resetData()" style="background:#dc3545;">Alle Markierungen löschen</button>
            <button onclick="toggleYearOverview()" style="background:#28a745;">Jahresübersicht</button>
            <button onclick="toggleFerien()" id="ferienBtn" style="background:#17a2b8;">Ferien</button>
        </div>

        <div class="holiday-note">
            <strong class="title">Feiertage in diesem Monat:</strong>
            <div id="holidayList"></div>
        </div>

        <div class="ferien-note" id="ferienNote">
            <strong>Ferien in Bayern:</strong><br>
            <span id="ferienList"></span>
        </div>

        <div id="yearOverview" class="overview-container">
            <h3>Jahresübersicht <span id="overviewYear"></span></h3>
            <div class="overview-stats">
                <span style="color: #8A2BE2;">Krank: <span id="countKrank">0</span> Tage</span>
                <span style="color: #228B22;">Urlaub: <span id="countUrlaub">0</span> Tage</span>
            </div>
            <div class="overview-list">
                <strong>Krankheitstage:</strong>
                <ul id="listKrank"></ul>
            </div>
            <div class="overview-list">
                <strong>Urlaubstage:</strong>
                <ul id="listUrlaub"></ul>
            </div>
            <button class="close-btn" onclick="toggleYearOverview()">Schließen</button>
        </div>
    </div>

    <script>
        const BASE_DATE = new Date(2026, 9, 1);

        const CYCLE_35 = [
            'F', 'F', 'N', 'N', 'N', '_', '_', '_', 
            'S', 'S', 'S', '_', 
            'F', 'F', 'N', 'N', '_', '_', '_', 
            'S', 'S', 'S', '_', 
            'F', 'F', 'F', 'N', 'N', 
            '_', '_', '_', '_', '_', '_', '_'
        ];
        const START_INDEX = 8;

        let currentDate = new Date(2026, 9, 1);
        let currentMode = 'normal';
        let showFerien = false;

        let sickDays = JSON.parse(localStorage.getItem('schichtzeitSickDays') || '[]');
        let vacationDays = JSON.parse(localStorage.getItem('schichtzeitVacationDays') || '[]');
        
        const savedGroup = localStorage.getItem('schichtzeitGroup') || '1';
        document.getElementById('groupSelect').value = savedGroup;

        const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
        const dayNames = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];

        // ============================================================
        // iOS-PWA-Erkennung: Подсказка для добавления на главный экран
        // ============================================================
        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        }

        function isInStandaloneMode() {
            return ('standalone' in window.navigator) && window.navigator.standalone;
        }

        function closeIosHint() {
            document.getElementById('iosHint').style.display = 'none';
            localStorage.setItem('iosHintClosed', '1');
        }

        if (isIOS() && !isInStandaloneMode() && !localStorage.getItem('iosHintClosed')) {
            document.getElementById('iosHint').style.display = 'block';
        }

        function calculateEaster(year) {
            const a = year % 19;
            const b = Math.floor(year / 100);
            const c = year % 100;
            const d = Math.floor(b / 4);
            const e = b % 4;
            const f = Math.floor((b + 8) / 25);
            const g = Math.floor((b - f + 1) / 3);
            const h = (19 * a + b - d - g + 15) % 30;
            const i = Math.floor(c / 4);
            const k = c % 4;
            const l = (32 + 2 * e + 2 * i - h - k) % 7;
            const m = Math.floor((a + 11 * h + 22 * l) / 451);
            const month = Math.floor((h + l - 7 * m + 114) / 31);
            const day = ((h + l - 7 * m + 114) % 31) + 1;
            return new Date(year, month - 1, day);
        }

        function getHolidayList(year) {
            const list = [];
            const add = (m, d, name) => {
                const date = new Date(year, m - 1, d);
                list.push({ name, date, key: `${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}` });
            };
            
            add(1, 1, "Neujahr");
            add(1, 6, "Heilige Drei Könige");
            add(5, 1, "Tag der Arbeit");
            add(8, 15, "Mariä Himmelfahrt");
            add(10, 3, "Tag der Deutschen Einheit");
            add(11, 1, "Allerheiligen");
            add(12, 25, "1. Weihnachtstag");
            add(12, 26, "2. Weihnachtstag");

            const easter = calculateEaster(year);
            const addEaster = (days, name) => {
                const d = new Date(easter);
                d.setDate(d.getDate() + days);
                add(d.getMonth() + 1, d.getDate(), name);
            };
            addEaster(-2, "Karfreitag");
            addEaster(1, "Ostermontag");
            addEaster(39, "Christi Himmelfahrt");
            addEaster(50, "Pfingstmontag");
            addEaster(60, "Fronleichnam");

            list.sort((a, b) => a.date - b.date);
            return list;
        }

        function getHolidaySet(year) {
            const s = new Set();
            getHolidayList(year).forEach(h => s.add(h.key));
            return s;
        }

        const FERIEN = {
            2026: [
                { name: "Winterferien", start: "2026-02-16", end: "2026-02-20" },
                { name: "Osterferien", start: "2026-03-30", end: "2026-04-10" },
                { name: "Pfingstferien", start: "2026-05-26", end: "2026-06-05" },
                { name: "Sommerferien", start: "2026-08-01", end: "2026-09-14" },
                { name: "Herbstferien", start: "2026-11-02", end: "2026-11-06" },
                { name: "Weihnachtsferien", start: "2026-12-21", end: "2026-12-31" }
            ],
            2027: [
                { name: "Winterferien", start: "2027-02-15", end: "2027-02-19" },
                { name: "Osterferien", start: "2027-03-22", end: "2027-04-02" },
                { name: "Pfingstferien", start: "2027-05-18", end: "2027-05-28" },
                { name: "Sommerferien", start: "2027-08-02", end: "2027-09-13" },
                { name: "Herbstferien", start: "2027-11-02", end: "2027-11-05" },
                { name: "Weihnachtsferien", start: "2027-12-23", end: "2027-12-31" }
            ],
            2028: [
                { name: "Winterferien", start: "2028-02-14", end: "2028-02-18" },
                { name: "Osterferien", start: "2028-04-10", end: "2028-04-21" },
                { name: "Pfingstferien", start: "2028-06-06", end: "2028-06-16" },
                { name: "Sommerferien", start: "2028-07-31", end: "2028-09-11" },
                { name: "Herbstferien", start: "2028-10-30", end: "2028-11-03" },
                { name: "Weihnachtsferien", start: "2028-12-23", end: "2028-12-31" }
            ]
        };

        function getFerienSet(year) {
            const set = new Set();
            (FERIEN[year] || []).forEach(period => {
                let current = new Date(period.start);
                const end = new Date(period.end);
                while (current <= end) {
                    set.add(`${current.getFullYear()}-${String(current.getMonth()+1).padStart(2,'0')}-${String(current.getDate()).padStart(2,'0')}`);
                    current.setDate(current.getDate() + 1);
                }
            });
            return set;
        }

        function formatDateKey(date) {
            return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
        }

        function getShift(date, group) {
            const diffTime = date.getTime() - BASE_DATE.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            let index = (START_INDEX + diffDays) % CYCLE_35.length;
            if (index < 0) index += CYCLE_35.length;
            return CYCLE_35[index];
        }

        function renderHolidayNote(year, month) {
            const listEl = document.getElementById('holidayList');
            const allList = getHolidayList(year);
            
            const currentList = allList.filter(h => h.date.getMonth() === month);
            
            if (currentList.length === 0) {
                listEl.innerHTML = '<span style="color:#999; font-style:italic;">Keine Feiertage in diesem Monat.</span>';
                return;
            }
            
            listEl.innerHTML = currentList.map(h => {
                const dd = String(h.date.getDate()).padStart(2,'0');
                const mm = String(h.date.getMonth()+1).padStart(2,'0');
                return `<span class="holiday-item current">${h.name} (${dd}.${mm})</span>`;
            }).join('');
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const group = document.getElementById('groupSelect').value;
            const holidays = getHolidaySet(year);
            const ferienSet = showFerien ? getFerienSet(year) : new Set();
            
            document.getElementById('monthDisplay').textContent = monthNames[month] + ' ' + year;

            const firstDayOfMonth = new Date(year, month, 1);
            const lastDayOfMonth = new Date(year, month + 1, 0);
            
            let startDay = firstDayOfMonth.getDay();
            startDay = startDay === 0 ? 6 : startDay - 1;

            const calendarEl = document.getElementById('calendar');
            calendarEl.innerHTML = '';

            dayNames.forEach(day => {
                const headerEl = document.createElement('div');
                headerEl.className = 'day-header';
                headerEl.textContent = day;
                calendarEl.appendChild(headerEl);
            });

            for (let i = 0; i < startDay; i++) {
                const emptyEl = document.createElement('div');
                emptyEl.className = 'day empty';
                calendarEl.appendChild(emptyEl);
            }

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            for (let day = 1; day <= lastDayOfMonth.getDate(); day++) {
                const date = new Date(year, month, day);
                const dateKey = formatDateKey(date);
                const shift = getShift(date, group);
                
                const dayEl = document.createElement('div');
                dayEl.className = `day ${shift}`;
                
                if (sickDays.includes(dateKey)) dayEl.classList.add('krank');
                else if (vacationDays.includes(dateKey)) dayEl.classList.add('urlaub');

                if (date.getTime() === today.getTime()) dayEl.classList.add('today');
                
                if (holidays.has(dateKey)) {
                    dayEl.classList.add('feiertag');
                    dayEl.title = "Feiertag";
                }

                if (showFerien && ferienSet.has(dateKey)) {
                    dayEl.classList.add('ferien');
                    dayEl.title = "Ferien";
                    const ferienMarker = document.createElement('span');
                    ferienMarker.className = 'ferien-marker';
                    ferienMarker.textContent = 'F';
                    dayEl.appendChild(ferienMarker);
                }

                const dateNumEl = document.createElement('span');
                dateNumEl.className = 'date-num';
                dateNumEl.textContent = day;
                
                const shiftTextEl = document.createElement('span');
                shiftTextEl.textContent = shift === '_' ? '' : shift;

                dayEl.appendChild(dateNumEl);
                dayEl.appendChild(shiftTextEl);
                
                dayEl.addEventListener('click', () => {
                    if (currentMode === 'krank') toggleDay(dateKey, 'krank');
                    else if (currentMode === 'urlaub') toggleDay(dateKey, 'urlaub');
                    else {
                        toggleDay(dateKey, 'krank', true);
                        toggleDay(dateKey, 'urlaub', true);
                    }
                });

                calendarEl.appendChild(dayEl);
            }

            renderHolidayNote(year, month);
            updateYearOverview();
            updateFerienList(year);
        }

        function updateFerienList(year) {
            const listEl = document.getElementById('ferienList');
            const periods = FERIEN[year] || [];
            if (periods.length === 0) {
                listEl.innerHTML = "Keine Daten für dieses Jahr verfügbar.";
                return;
            }
            const formatD = (s) => {
                const [y,m,d] = s.split('-');
                return `${d}.${m}.${y}`;
            };
            listEl.innerHTML = periods.map(p => `${p.name}: ${formatD(p.start)} – ${formatD(p.end)}`).join('<br>');
        }

        function toggleDay(dateKey, type, forceRemove = false) {
            let array = type === 'krank' ? sickDays : vacationDays;
            const index = array.indexOf(dateKey);

            if (index > -1 || forceRemove) {
                if (index > -1) array.splice(index, 1);
            } else {
                array.push(dateKey);
                if (type === 'krank') {
                    const vIndex = vacationDays.indexOf(dateKey);
                    if (vIndex > -1) vacationDays.splice(vIndex, 1);
                } else if (type === 'urlaub') {
                    const sIndex = sickDays.indexOf(dateKey);
                    if (sIndex > -1) sickDays.splice(sIndex, 1);
                }
            }

            if (type === 'krank' || forceRemove) localStorage.setItem('schichtzeitSickDays', JSON.stringify(sickDays));
            if (type === 'urlaub' || forceRemove) localStorage.setItem('schichtzeitVacationDays', JSON.stringify(vacationDays));
            
            renderCalendar();
        }

        function toggleFerien() {
            showFerien = !showFerien;
            const btn = document.getElementById('ferienBtn');
            const note = document.getElementById('ferienNote');
            if (showFerien) {
                btn.style.background = '#0d8a99';
                note.style.display = 'block';
            } else {
                btn.style.background = '#17a2b8';
                note.style.display = 'none';
            }
            renderCalendar();
        }

        function updateYearOverview() {
            const year = currentDate.getFullYear();
            document.getElementById('overviewYear').textContent = year;

            const yearSick = sickDays.filter(d => d.startsWith(year + '-')).sort();
            const yearVacation = vacationDays.filter(d => d.startsWith(year + '-')).sort();

            document.getElementById('countKrank').textContent = yearSick.length;
            document.getElementById('countUrlaub').textContent = yearVacation.length;

            const formatDate = (dateStr) => {
                const [y, m, d] = dateStr.split('-');
                return `${d}.${m}.${y}`;
            };

            const listKrank = document.getElementById('listKrank');
            listKrank.innerHTML = yearSick.length ? yearSick.map(d => `<li>${formatDate(d)}</li>`).join('') : '<li>Keine Einträge</li>';

            const listUrlaub = document.getElementById('listUrlaub');
            listUrlaub.innerHTML = yearVacation.length ? yearVacation.map(d => `<li>${formatDate(d)}</li>`).join('') : '<li>Keine Einträge</li>';
        }

        function toggleYearOverview() {
            const overview = document.getElementById('yearOverview');
            if (overview.style.display === 'block') {
                overview.style.display = 'none';
            } else {
                overview.style.display = 'block';
                updateYearOverview();
            }
        }

        function resetData() {
            if (confirm("Möchtest du wirklich alle Krankheits- und Urlaubstage löschen?")) {
                sickDays = [];
                vacationDays = [];
                localStorage.removeItem('schichtzeitSickDays');
                localStorage.removeItem('schichtzeitVacationDays');
                renderCalendar();
            }
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        document.getElementById('groupSelect').addEventListener('change', (e) => {
            localStorage.setItem('schichtzeitGroup', e.target.value);
            renderCalendar();
        });

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentMode = e.target.getAttribute('data-mode');
            });
        });

        renderCalendar();
    </script>
</body>
</html>
